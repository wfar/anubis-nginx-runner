# Example nginx setup: Anubis in front of a static site.
# For an app instead of files, see service-example.conf.
#
#   client -> nginx :443 -> Anubis 127.0.0.1:8923 -> nginx 127.0.0.1:8081 (serves the files)
#
# Replace the placeholders marked "example" below, including your hostnames,
# certificate paths and web root. List the same hostnames in
# ANUBIS_REDIRECT_DOMAINS in anubis.env.
#
# The "backup" server makes this fail open, which means if Anubis is down,
# nginx serves the static site directly without going through the Anubis check.
# Delete that line to fail closed (502) instead.

upstream anubis {
  server 127.0.0.1:8923;
  server 127.0.0.1:8081 backup;
}

server {
  listen 80;
  listen [::]:80;
  server_name example.com www.example.com;
  server_tokens off;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name example.com www.example.com;
  server_tokens off;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    proxy_next_upstream error timeout;
    proxy_connect_timeout 2s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-TLS-SNI-Name $ssl_server_name;
    proxy_pass http://anubis;
  }
}

# Serves the files to Anubis once a visitor passes. It does no bot checking of its
# own, so it listens on loopback where nothing outside the server can reach it.
server {
  listen 127.0.0.1:8081;
  server_name _;
  server_tokens off;

  set_real_ip_from 127.0.0.1;
  real_ip_header X-Real-IP;

  root /var/www/example.com;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }
}
