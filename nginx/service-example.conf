# Example nginx setup: Anubis in front of an app listening on 127.0.0.1:3000.
# For serving static files instead, see static-site-example.conf.
#
#   client -> nginx :443 -> Anubis 127.0.0.1:8923 -> nginx 127.0.0.1:8081 -> app 127.0.0.1:3000
#
# Replace the placeholders marked "example" below, including your hostnames and
# certificate paths. List the same hostnames in ANUBIS_REDIRECT_DOMAINS in
# anubis.env.
#
# The "backup" server makes this fail open which means that if Anubis is down, traffic goes
# straight to the app without going through Anubis check.
# Delete that line to fail closed (502) instead.

upstream anubis {
  server 127.0.0.1:8923;
  server 127.0.0.1:8081 backup;
}

upstream app {
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name example.com www.example.com;
  server_tokens off;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name example.com www.example.com;
  server_tokens off;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 10m;

  # add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    # No "timeout" here: a slow response must not be replayed against the app.
    proxy_next_upstream error;
    proxy_connect_timeout 2s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-TLS-SNI-Name $ssl_server_name;
    proxy_pass http://anubis;
  }
}

# Passes traffic from Anubis to the app once a visitor passes. It does no bot
# checking of its own, so it listens on loopback where nothing outside the
# server can reach it.
server {
  listen 127.0.0.1:8081;
  server_name _;
  server_tokens off;

  set_real_ip_from 127.0.0.1;
  real_ip_header X-Real-IP;

  client_max_body_size 10m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwritten rather than appended, so clients cannot spoof them.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://app;
  }
}
